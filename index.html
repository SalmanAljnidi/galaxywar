    <meta name="mobile-web-app-capable" content="yes">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: white;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at bottom, #1B2735 0%, #090A0F 100%);
        }

        /* واجهة المستخدم UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }

        .question-box {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 0 0 20px #ff9800;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 20px;
            border: 2px solid #ff9800;
        }

        .visual-dots {
            font-size: 1rem;
            color: #00ffcc;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* زر الإطلاق للجوال */
        #fireBtn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff5252 0%, #b71c1c 100%);
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            pointer-events: auto;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        #fireBtn:active { transform: scale(0.9); background: #ff0000; }
        
        /* أيقونة داخل الزر */
        #fireBtn::after {
            content: '🔥';
            font-size: 2rem;
        }

        /* الشاشات المنبثقة */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: linear-gradient(45deg, #FF512F, #DD2476);
            border: none;
            padding: 12px 35px;
            font-size: 1.3rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            margin: 10px;
            box-shadow: 0 0 15px rgba(221, 36, 118, 0.6);
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-blue { background: linear-gradient(45deg, #1A2980, #26D0CE); box-shadow: 0 0 15px rgba(38, 208, 206, 0.6); }

        /* تذييل الحقوق */
        .footer {
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .copyright { color: #888; font-size: 0.9rem; }
        .social-links { display: flex; gap: 20px; margin-top: 10px; }
        .social-icon {
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            transition: all 0.3s;
            text-decoration: none;
        }
        .social-icon svg { width: 24px; height: 24px; fill: white; }
        .social-icon.whatsapp:hover { background: #25D366; box-shadow: 0 0 15px #25D366; }
        .social-icon.snapchat:hover { background: #FFFC00; box-shadow: 0 0 15px #FFFC00; }
        .social-icon.snapchat svg { fill: black; } /* سناب أيقونته سوداء على خلفية صفراء */
        .social-icon.snapchat:hover svg { fill: black; }

        /* إخفاء زر الإطلاق في الكمبيوتر */
        @media (min-width: 1024px) {
            #fireBtn { display: none; }
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="gameUI" class="ui-layer hidden">
            <div class="header-info">
                <span id="scoreDisplay">النقاط: ٠</span>
                <span id="healthDisplay">❤️❤️❤️</span>

            <div id="questionDisplay" class="question-box">

                <div id="qVisual" class="visual-dots">***** + ***</div>
            </div>

        </div>

        <div id="startScreen" class="screen">

            <p style="color: #00ffff; font-size: 1.1rem; margin-bottom: 20px;">استخدم الأسهم للحركة والمسافة للإطلاق (أو اللمس والزر الأحمر)</p>
            
            <button class="btn btn-blue" onclick="startGame('lower')">الصفوف الأولية (جمع/طرح)</button>
            <button class="btn" onclick="startGame('upper')">الصفوف العليا (ضرب/قسمة)</button>

            <div class="footer">
                <div class="copyright">جميع الحقوق محفوظة لـ سلمان الجنيدي</div>
                <div class="social-links">

                </div>

        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1 style="color: #ff3333; -webkit-text-fill-color: #ff3333;">انتهت اللعبة!</h1>
            <p id="finalScore" style="font-size: 2rem; color: #ffeb3b;">النقاط: ٠</p>
            <button class="btn" onclick="location.reload()">لعب مرة أخرى</button>

                <div class="copyright">جميع الحقوق محفوظة لـ سلمان الجنيدي</div>

    <script>
        // --- إعدادات اللعبة ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fireBtn = document.getElementById('fireBtn');
        
        let gameState = 'start'; 
        let gameMode = 'lower'; 
        let score = 0;
        let lives = 3;
        let level = 1;
        
        let currentQuestion = {};
        let enemies = [];
        let particles = [];
        let bullets = [];
        let stars = [];
        
        // حالة المفاتيح
        let keys = { ArrowRight: false, ArrowLeft: false, Space: false };

        const toEnglishDigits = (str) => str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        const toArabicDigits = (n) => n.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- كائنات اللعبة ---

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120, // رفعنا اللاعب قليلاً بسبب زر الإطلاق
            width: 60,
            height: 60,
            speed: 15,
            color: '#00ffff'
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function initStars() {
            stars = [];
            for(let i=0; i<100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 3 + 0.5
                });
            }
        }

        function generateQuestion() {
            let qText = "";
            let qVisual = "";
            let answer = 0;
            let n1, n2;

            if (gameMode === 'lower') {
                if (Math.random() > 0.5) {
                    n1 = Math.floor(Math.random() * 6);
                    n2 = Math.floor(Math.random() * 6);
                    answer = n1 + n2;
                    qText = `${toArabicDigits(n1)} + ${toArabicDigits(n2)}`;
                    qVisual = `${"●".repeat(n1)} + ${"●".repeat(n2)}`;
                } else {
                    n1 = Math.floor(Math.random() * 11);
                    n2 = Math.floor(Math.random() * (n1 + 1));
                    answer = n1 - n2;
                    qText = `${toArabicDigits(n1)} - ${toArabicDigits(n2)}`;
                    qVisual = `${"●".repeat(n1)} - ${toArabicDigits(n2)}`;
                }
            } else {
                if (Math.random() > 0.5) {
                    n1 = Math.floor(Math.random() * 11);
                    n2 = Math.floor(Math.random() * 11);
                    answer = n1 * n2;
                    qText = `${toArabicDigits(n1)} × ${toArabicDigits(n2)}`;
                } else {
                    let result = Math.floor(Math.random() * 10);
                    let divisor = Math.floor(Math.random() * 9) + 1;
                    let dividend = result * divisor;
                    answer = result;
                    qText = `${toArabicDigits(dividend)} ÷ ${toArabicDigits(divisor)}`;
                }
            }

            currentQuestion = { text: qText + " = ؟", visual: qVisual, answer: answer };
            document.getElementById('qText').innerText = currentQuestion.text;
            document.getElementById('qVisual').innerText = currentQuestion.visual;
            spawnEnemies(true); 
        }

        function spawnEnemies(reset = false) {
            if(reset) enemies = [];
            let correctX = Math.random() * (canvas.width - 60) + 30;
            enemies.push({ x: correctX, y: -50, value: currentQuestion.answer, isCorrect: true, speed: 1.5 + (level * 0.1), color: '#4CAF50', radius: 35 });

            let wrongCount = 2 + Math.floor(level / 3);
            for(let i=0; i<wrongCount; i++) {
                let wrongVal;
                do {
                    wrongVal = Math.floor(Math.random() * (gameMode === 'upper' ? 100 : 15));
                } while (wrongVal === currentQuestion.answer);
                enemies.push({ x: Math.random() * (canvas.width - 60) + 30, y: -Math.random() * 200 - 50, value: wrongVal, isCorrect: false, speed: 2 + (level * 0.1), color: '#FF5252', radius: 30 });
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1.0, color: color });
            }
        }

        function shoot() {
            bullets.push({x: player.x, y: player.y - 20});
            playSound('shoot');
        }

        // --- التحكم الجديد ---
        
        // 1. لوحة المفاتيح
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'Space') {
                if (!keys.Space) shoot(); // منع التكرار السريع عند التعليق
                keys.Space = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // 2. زر الإطلاق (جوال)
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            shoot();
        }, {passive: false});
        
        fireBtn.addEventListener('mousedown', (e) => {
            e.preventDefault(); 
            shoot();
        });

        // 3. حركة اللمس (بدون إطلاق)
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            player.x = touch.clientX;
        }, {passive: false});

        // تحديث الموقع بناءً على المدخلات
        function updatePlayerPosition() {
            if (keys.ArrowRight) player.x += player.speed;
            if (keys.ArrowLeft) player.x -= player.speed;
            
            // حدود الشاشة
            if (player.x < 30) player.x = 30;
            if (player.x > canvas.width - 30) player.x = canvas.width - 30;
        }

        // --- الحلقة الرئيسية ---
        function update() {
            if (gameState !== 'playing') return;

            updatePlayerPosition();

            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // رسم اللاعب
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(20, 20);
            ctx.lineTo(0, 10);
            ctx.lineTo(-20, 20);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // الرصاص
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= 10;
                ctx.fillStyle = '#ffeb3b';
                ctx.fillRect(b.x - 2, b.y, 4, 15);
                if (b.y < 0) bullets.splice(i, 1);
            }

            // الأعداء
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#333'; 
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#888'; 
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Cairo';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(toArabicDigits(e.value), e.x, e.y);

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < e.radius) {
                        createExplosion(e.x, e.y, e.isCorrect ? '#00ff00' : '#ff0000');
                        bullets.splice(j, 1);
                        enemies.splice(i, 1);
                        if (e.isCorrect) {
                            playSound('correct');
                            score += 10;
                            level += 0.2;
                            document.getElementById('scoreDisplay').innerText = 'النقاط: ' + toArabicDigits(score);
                            generateQuestion();
                        } else {
                            playSound('explosion');
                            lives--;
                            updateLives();
                            if (lives <= 0) gameOver();
                        }
                        break;
                    }
                }

                if (e.y > canvas.height + 50) {
                    enemies.splice(i, 1);
                    if (e.isCorrect) {
                        lives--;
                        updateLives();
                        if (lives <= 0) gameOver();
                        else {
                             spawnEnemies(false);
                             generateQuestion();
                        }
                    }
                }
            }
            
            let hasCorrect = enemies.some(e => e.isCorrect);
            if (!hasCorrect && enemies.length < 3 && gameState === 'playing') {
                 let correctX = Math.random() * (canvas.width - 60) + 30;
                 enemies.push({x: correctX, y: -50, value: currentQuestion.answer, isCorrect: true, speed: 2, color: '#4CAF50', radius: 35});
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(update);
        }

        function updateLives() {
            document.getElementById('healthDisplay').innerText = "❤️".repeat(lives);
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            score = 0;
            lives = 3;
            level = 1;
            enemies = [];
            bullets = [];
            particles = [];
            
            document.getElementById('scoreDisplay').innerText = 'النقاط: ٠';
            updateLives();
            gameState = 'playing';
            initStars();
            generateQuestion();
            update();
        }

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('gameUI').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = 'النقاط النهائية: ' + toArabicDigits(score);
            playSound('explosion');
        }

        initStars();
        function bgLoop() {
            if (gameState === 'start') {
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > canvas.height) star.y = 0;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(bgLoop);
            }
        }
        bgLoop();
    </script>
</body>
</html>
